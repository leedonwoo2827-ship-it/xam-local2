<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XAM 엑스잼</title>
<meta name="description" content="문제은행 로컬 운영 콘솔 — 문항 교정 · 영상 검수 · 발행" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c41c0b'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='9.5' font-weight='700' fill='%23fffff3' text-anchor='middle'%3EXAM%3C/text%3E%3C/svg%3E" />
<link rel="preload" href="/static/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/static/css/app.css" />
<!-- OCR 검수 화면 전용. app.css 의 토큰을 쓰고 규칙만 분리해 둔다. -->
<link rel="stylesheet" href="/static/css/ocr.css" />
<!-- ★ 상태 3색 규칙 — 전역 정책. 화면별 CSS 를 덮어야 하므로 **항상 마지막**. -->
<link rel="stylesheet" href="/static/css/state.css" />
</head>
<body>
<!-- ══ Layer 0 — 베이스 (좌측 레일 + 작업 본문) ══════════════════════════ -->
<div class="app">
  <nav class="rail" id="rail" aria-label="주 메뉴">
    <div class="side-brand">
      <button class="brand-mark" id="brand-mark" type="button" title="메뉴 펼치기">XAM</button>
      <span class="brand-name">엑스잼</span>
      <button class="rail-toggle" id="rail-toggle" type="button"
              title="메뉴 접기 (Ctrl+B)" aria-label="메뉴 접기">
        <span data-icon="panelLeft" data-icon-size="16"></span>
      </button>
    </div>

    <!-- ★ 큰 버튼은 **지금 화면의 주 동작**이다.
         초심자는 툴바의 작은 버튼을 주 동작으로 읽지 못한다(2026-08-18 지시:
         "실사용자들이 초심자라 주 버튼이 작은걸 잘 이해를 못해요").
         그래서 라벨·동작을 화면이 정한다 — `shell.js` 의 PRIMARY 표. -->
    <button class="btn-new" id="btn-primary" type="button">
      <span data-icon="check" data-icon-size="15" id="btn-primary-icon"></span>
      <span id="btn-primary-label">다음 미검수 문항</span>
    </button>
    <button class="btn-new" id="btn-primary2" type="button" hidden
            style="margin-top:6px;background:var(--linen-deep);color:var(--text-1)">
      <span data-icon="sparkles" data-icon-size="15" id="btn-primary2-icon"></span>
      <span id="btn-primary2-label"></span>
    </button>

    <ul class="side-nav" id="side-nav">
      <!-- 기출(01/) — 스캔 PDF 를 구조화 MD 로 만드는 단계. 도구 #1 -->
      <li><a href="#/ocr" data-nav="oc" title="OCR 검수 (스캔 → 01/)">
        <span data-icon="folder"></span><span>OCR 검수 <em class="nav-dest">스캔→01</em></span></a></li>
      <li><a href="#/scan" data-nav="sc" title="구조화 MD로 정리">
        <span data-icon="file"></span><span>구조화 MD로 정리</span></a></li>

      <!-- ★ 과정 정의 — 새 과정의 `exams/<id>.json` 을 세우는 자리(2026-09-07).
           ★ 왜 여기(경계 위)인가. 이 단계는 **스캔이 없어도 시작할 수 있다.**
             해가 바뀌어 개정만 반영하면 될 때는 OCR 을 다시 돌리지 않고
             공고 조사만으로 이 화면에서 시작한다. 그래서 산물(_rounds 아래)이
             아니라 입구 쪽에 둔다.
           ★ 이 화면은 **만들지 않고 보낸다.** 공고·출제경향을 읽으려면 웹이
             필요한데 앱이 띄우는 Claude 세션은 WebFetch·WebSearch 가 막혀 있다
             (`services/authoring/provider.py`). 그래서 시킬 말을 적어 주고
             돌아온 JSON 을 받아 검산한다. -->
      <li><a href="#/exams" data-nav="ed" title="과정 정의 — 시험정보 JSON">
        <span data-icon="bulb"></span><span>과정 정의 <em class="nav-dest">시험정보</em></span></a></li>

      <!-- ★ 여기가 경계다 — 위는 기출(01/), 아래는 자사 산물(_rounds·02~06).
           아래 화면들은 도구 #2 가 02/ 를 만든 뒤에야 열린다. 그 차이가 커서
           같은 목록에 붙여 두면 "왜 저건 안 열리나" 를 매번 다시 겪는다. -->
      <li class="side-nav-sep" aria-hidden="true"></li>

      <!-- ★ 집필 — 여기가 도구 #2(클로드 데스크탑)를 대신한다. 이 앱에서 유일하게
           모델을 부르는 화면이고, **집필자 각자의 Claude Code 구독**으로 나간다
           (API 키 없음). `_rounds/` 를 만드는 단계라 `문항 교정` 바로 위에 둔다 —
           위에서 만들고 아래에서 고치는 순서가 목록 순서와 같아야 한다. -->
      <li><a href="#/authoring" data-nav="a" title="문항 집필 (Claude 구독 OAuth)">
        <span data-icon="bulb"></span><span>문항 집필 <em class="nav-dest">→_rounds</em></span></a></li>

      <li><a href="#/questions" data-nav="q" title="문항 교정">
        <span data-icon="file"></span><span>문항 교정</span></a></li>
      <!-- ★ 라벨이 "검수" 에서 "제작" 으로 바뀌었다(2026-08-12). 이 화면이 이제
           `03/` 요약노트를 **만드는** 곳이기도 하다 — [이론 집필] 버튼이 붙었다.
           검수만 하는 곳으로 읽히면 사람이 만들 방법을 찾아 딴 데를 뒤진다. -->
      <li><a href="#/summary" data-nav="s" title="이론 요약 노트 제작·검수">
        <span data-icon="bulb"></span><span>이론 요약 노트 <em class="nav-dest">제작</em></span></a></li>

      <!-- ★ **발행이 2단계라 목록도 두 묶음이다** (2026-08-25 운영 결정).
           위 묶음이 «문제집», 아래 묶음이 «해설영상» 이고, 각 묶음의 **끝이 발행**이다.

               문항 집필 → 교정 → 이론 → [etest 발행 · 1차]
               슬라이드 → 영상 → 인쇄본 → [해설영상 발행 · 2차]

           전에는 발행이 맨 아래 하나뿐이라, 영상이 한 편이라도 없으면 문항까지
           못 나갔다. 화면이 그 순서를 말하지 않으면 사람이 매번 물어야 한다.
           (게이트 자체는 `services/publish/validate.py` 의 `SCOPES` 가 가른다.) -->
      <li><a href="#/publish/problems" data-nav="p" title="etest 발행 — 문제집 (1차)">
        <span data-icon="package"></span><span>etest 발행 <em class="nav-dest">문제집 1차</em></span></a></li>

      <li class="side-nav-sep" aria-hidden="true"></li>

      <!-- ★ 여기부터가 «해설영상» 묶음이다 — 슬라이드 → 영상 → 인쇄본 → 발행.
           슬라이드가 영상 앞인 이유: 분할·넘침을 먼저 잡아야 영상을 다시 굽지 않는다.
           인쇄본이 발행 앞인 이유: 종이 검수가 발행 전 마지막 관문이다.

           ★ 목적지 표시(`nav-dest`)에 **폴더 번호를 넣지 않는다.** 02·03·04·05·06 이
             바뀔 수 있다고 했다 — 번호를 라벨에 박으면 폴더를 옮길 때 화면이 거짓말을
             한다. 단계 이름만 쓴다. -->

      <!-- ★ 앱 안 화면이다(2026-08-20). 굽기 버튼이 여기 있어야 한다 —
           05/ 를 만드는 입구가 CLI(`tools/bake_all.py`) 뿐이라, 새 책은 영상 화면에서
           100번들이 `broken` 으로 뜨고 [미완성만 렌더] 가 「렌더할 번들이 없습니다」 로
           끝났다. 사람이 다음에 무엇을 눌러야 하는지 알 방법이 없었다.
           ★ **보는 일은 새 탭이 그대로 맡는다.** 슬라이드가 1920×1080 고정이라
             앱 셸(레일 248px) 안에서는 축소돼 넘침을 판단할 수 없다. 그 링크는
             이 화면 아래쪽 「눈으로 보기」 칸에 있다.

             ★ 2026-08-24 부터 이 화면이 **PPTX 까지** 맡는다 — 슬라이드의 진실이
             deck.html 캡처에서 `05/<번들>/source/deck.pptx` 로 옮겨 갔다. 그래서
             목적지 표시를 「제작」에서 「PPTX」로 바꿨다. -->
      <li><a href="#/slides" data-nav="sl"
             title="슬라이드 제작 — 굽기 → PPTX → 장수 확정 → 그림파일">
        <span data-icon="grid"></span><span>슬라이드 제작 <em class="nav-dest">PPTX·그림</em></span></a></li>

      <li><a href="#/video" data-nav="v" title="영상 제작·검수">
        <span data-icon="film"></span><span>영상 제작·검수</span></a></li>

      <!-- ★ 인쇄본도 별개 페이지다 — Ctrl+P 로 뽑을 때 앱 화면이 같이 인쇄되면 안 된다. -->
      <li><a href="/print/" target="_blank" rel="noopener" title="문항·대본 인쇄본 (새 탭)">
        <span data-icon="file"></span><span>인쇄본 <em class="nav-dest">종이 검수</em></span></a></li>

      <li><a href="#/publish/video" data-nav="p2" title="해설영상 발행 (2차) — 영상 링크까지">
        <span data-icon="package"></span><span>해설영상 발행 <em class="nav-dest">영상 2차</em></span></a></li>
    </ul>

    <div class="side-section">
      <span class="side-section-title">최근 작업</span>
      <a class="side-section-more" href="#/publish">발행 이력</a>
    </div>
    <div class="side-recent" id="side-recent">
      <div class="side-empty">아직 작업이 없습니다.</div>
    </div>

    <div class="rail-wrap">
      <button class="side-user" id="side-user" type="button"
              aria-haspopup="dialog" aria-expanded="false" title="작업 폴더 · 품목 전환">
        <span class="su-avatar" id="su-avatar">XAM</span>
        <span class="su-text">
          <span class="su-name" id="su-name">빅데이터분석기사</span>
          <span class="su-team" id="su-team">—</span>
        </span>
        <span data-icon="chevronUp" data-icon-size="14"></span>
      </button>
    </div>
  </nav>

  <main class="content" id="view" tabindex="-1"></main>
</div>

<!-- ══ Layer 1 — 부유 패널 (사전점검 · 잡 · HTML 미리보기). panel.js 가 만든다. ══ -->
<div class="panel-layer" id="panel-layer" hidden></div>

<!-- ══ Layer 2 — 모달 · 토스트 ═══════════════════════════════════════════ -->
<div class="overlay" id="app-overlay" hidden>
  <div class="modal" id="app-modal"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/static/js/shell.js"></script>
</body>
</html>
